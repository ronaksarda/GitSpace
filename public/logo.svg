<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="GitSpace">
  <!-- Ringed planet with a galaxy inside; the "face" is a constellation shaped like a git branch:
       commits are stars, a branch splits off and merges back. -->
  <defs>
    <radialGradient id="gsSky" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2B3566"/>
      <stop offset="0.55" stop-color="#141A3A"/>
      <stop offset="1" stop-color="#070914"/>
    </radialGradient>
    <linearGradient id="gsBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E5A8E" stop-opacity="0.2"/>
      <stop offset="0.25" stop-color="#C9A97A"/>
      <stop offset="0.5" stop-color="#8E86B8"/>
      <stop offset="0.75" stop-color="#D9B98A"/>
      <stop offset="1" stop-color="#6E5A8E" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="gsMilky" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E9D6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E9D6FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="gsPlanet"><circle cx="160" cy="100" r="62"/></clipPath>
    <clipPath id="gsRingBack"><rect x="0" y="0" width="320" height="100"/></clipPath>
    <clipPath id="gsRingFront"><rect x="0" y="100" width="320" height="100"/></clipPath>
  </defs>

  <!-- ring, back half (behind the planet) -->
  <g transform="rotate(-14 160 100)" clip-path="url(#gsRingBack)">
    <ellipse cx="160" cy="100" rx="142" ry="34" fill="none" stroke="#FFF4E6" stroke-width="16"/>
    <ellipse cx="160" cy="100" rx="142" ry="34" fill="none" stroke="url(#gsBand)" stroke-width="10"/>
    <ellipse cx="160" cy="100" rx="128" ry="28" fill="none" stroke="#5B527A" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- planet: sticker outline, glow rim, galaxy -->
  <circle cx="160" cy="100" r="74" fill="#FFF4E6"/>
  <circle cx="160" cy="100" r="68" fill="#0B0E1F"/>
  <circle cx="160" cy="100" r="64" fill="none" stroke="#DCE4FF" stroke-width="3" stroke-opacity="0.85"/>
  <g clip-path="url(#gsPlanet)">
    <rect x="90" y="30" width="140" height="140" fill="url(#gsSky)"/>
    <ellipse cx="160" cy="104" rx="70" ry="16" transform="rotate(-24 160 104)" fill="url(#gsMilky)"/>
    <g fill="#FFFFFF">
      <circle cx="118" cy="70" r="0.9"/><circle cx="131" cy="128" r="0.8"/><circle cx="190" cy="66" r="1"/>
      <circle cx="205" cy="118" r="0.8"/><circle cx="146" cy="56" r="0.7"/><circle cx="178" cy="142" r="0.9"/>
      <circle cx="112" cy="104" r="0.7"/><circle cx="214" cy="92" r="0.7"/><circle cx="168" cy="80" r="0.6"/>
      <circle cx="140" cy="146" r="0.6"/><circle cx="198" cy="140" r="0.6"/><circle cx="125" cy="86" r="0.6"/>
    </g>
    <!-- git-branch constellation -->
    <g stroke="#CFE0FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M140 140 L140 66"/>
      <path d="M140 118 C140 104 176 106 176 90 L176 80"/>
      <path d="M176 80 C176 72 140 76 140 66"/>
    </g>
    <circle cx="140" cy="140" r="5" fill="#FFFFFF"/>
    <circle cx="140" cy="118" r="4.2" fill="#C3D6FF"/>
    <circle cx="176" cy="92" r="4.6" fill="#FFB35C"/>
    <circle cx="140" cy="66" r="5.6" fill="#FFFFFF"/>
    <circle cx="140" cy="66" r="10" fill="#FFFFFF" opacity="0.18"/>
  </g>

  <!-- ring, front half (over the planet) -->
  <g transform="rotate(-14 160 100)" clip-path="url(#gsRingFront)">
    <ellipse cx="160" cy="100" rx="142" ry="34" fill="none" stroke="#FFF4E6" stroke-width="16"/>
    <ellipse cx="160" cy="100" rx="142" ry="34" fill="none" stroke="url(#gsBand)" stroke-width="10"/>
    <ellipse cx="160" cy="100" rx="128" ry="28" fill="none" stroke="#5B527A" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
