<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitSpace</title>
  <meta name="description" content="Every public repo you have becomes a building on your own island. Fly to any developer's island and see what they have built.">
  <meta property="og:title" content="GitSpace">
  <meta property="og:description" content="Every public repo you have becomes a building on your own island. Fly to any developer's island and see what they have built.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GitSpace">
  <meta name="twitter:description" content="Your GitHub as a place people can visit.">
  <meta name="theme-color" content="#0B0B10">
  <link rel="icon" type="image/png" href="logo.png?v=28">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://avatars.githubusercontent.com">
  <!-- Fredoka + Rubik are drawn on the canvas (island signs, labels); Satoshi + Space Mono are the UI -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Rubik:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=67">
  <link rel="stylesheet" href="app/app.css?v=1">
</head>

<body>
  <canvas id="world"></canvas>
  <div id="ui-root"></div>

  <!-- Driven by the engine (render.js / network.js) -->
  <div id="repo-tooltip" style="display:none">
    <div id="tt-name"></div>
    <div id="tt-lang"></div>
    <div id="tt-stars"></div>
  </div>
  <div id="offline-banner" class="hidden" role="status">Connection lost. New islands load when you are back online.</div>

  <script src="js/engine.js?v=52"></script>
  <script src="js/input.js?v=40"></script>
  <script src="js/render.js?v=44"></script>
  <script src="js/network.js?v=32"></script>
  <script src="js/init.js?v=33"></script>
  <script type="module" src="app/app.js?v=1"></script>
</body>

</html>
